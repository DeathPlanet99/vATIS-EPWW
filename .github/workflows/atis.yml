name: Monitor ATIS

on:
  schedule:
    - cron: '15,45 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja bibliotek
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Uruchom scraper
        run: python scraper.py

      - name: Commit i push zmian
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          mkdir -p data
          git add data/
          
          if git diff --staged --quiet; then
            echo "Brak nowych danych do zatwierdzenia."
          else
            git commit -m "Nowy ATIS $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            # Pobieramy ewentualne nowsze commity z GitHuba i rebasujemy przed wysłaniem.
            # Powtarzamy próbę, jeśli między pull a push pojawi się nowy commit na main.
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin main; then
                echo "Zmiany wypchnięte do origin/main."
                break
              fi

              if [ "$attempt" -eq 3 ]; then
                echo "Nie udało się wypchnąć zmian po 3 próbach."
                exit 1
              fi

              echo "Push odrzucony (non-fast-forward). Ponawiam: próba ${attempt}/3..."
              sleep 2
            done
          fi
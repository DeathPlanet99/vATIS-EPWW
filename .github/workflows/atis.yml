name: Monitor ATIS

on:
  schedule:
    - cron: '15,45 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja bibliotek
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Uruchom scraper
        run: python scraper.py

      - name: Commit i push zmian
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          mkdir -p data
          git add data/
          
          if git diff --staged --quiet; then
            echo "Brak nowych plików ATIS do zatwierdzenia."
          else
            git commit -m "Nowy ATIS $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git pull --rebase origin main || git pull --rebase origin master || true
            git push origin HEAD
          fi
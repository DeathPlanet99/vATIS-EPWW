name: Monitor ATIS

on:
  schedule:
    # Skrypt startuje w 10. i 40. minucie każdej godziny
    - cron: '10,40 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atis-scraper
  cancel-in-progress: false

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja bibliotek
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Uruchom scraper
        run: python scraper.py

      - name: Zapisz datę do nazwy commita
        run: echo "COMMIT_DATE=$(date -u +'%d.%m.%Y %H:%M UTC')" >> $GITHUB_ENV

      - name: Commit i push zmian
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Aktualizacja ATIS: ${{ env.COMMIT_DATE }}"
          file_pattern: "data/**"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"